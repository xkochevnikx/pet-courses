services:
  # =========================
  # Dev-override поверх docker-compose.yml
  # =========================
  # Только отличия от базового файла. db-sessions, db-courses, minio, createbuckets,
  # mongo, bot, volumes, ports — из docker-compose.yml. Списки (ports, volumes) в dev
  # не дублируем: Compose склеивает их, а не заменяет → EADDRINUSE.

  web:
    image: node:22-bookworm-slim
    container_name: web-dev

    command: >
      sh -lc "
        set -e;
        if ! dpkg -s openssl >/dev/null 2>&1; then
          echo '[web-dev] apt: openssl...';
          apt-get update -y;
          apt-get install -y --no-install-recommends openssl ca-certificates;
          rm -rf /var/lib/apt/lists/*;
        fi;

        echo '[web-dev] npm install (mount volume)...';
        npm install --no-audit --no-fund;

        echo '[web-dev] Prisma migrate...';
        npm run prisma:migrate || npm run prisma:push;

        echo '[web-dev] start dev server';
        npm run dev
      "

    environment:
      NODE_ENV: development
      # Docker DNS: имена сервисов, не 127.0.0.1
      DATABASE_URL: postgres://postgres:postgres@db-sessions:5432/sessions
      PAYLOAD_DATABASE_URL: postgres://postgres:postgres@db-courses:5432/courses
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_URL: http://localhost:9000/images
      MINIO_INTERNAL_BASE: http://minio:9000/images
      NEXTAUTH_URL: http://localhost:3000
      PORT: ${PORT:-3000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
